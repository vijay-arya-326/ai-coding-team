[project]
name = "ai-agent-backend"
version = "0.1.0"
description = "Basic LangGraph agent served over FastAPI with Ollama (phi3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langchain>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
